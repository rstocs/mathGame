name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc -b && vite build`. This is the real type check:
      # the root tsconfig has "files": [], so a bare `tsc --noEmit` is a no-op.
      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
