name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc -b && vite build`. This is the real type check:
      # the root tsconfig has "files": [], so a bare `tsc --noEmit` is a no-op.
      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Pure string reasoning, so it needs no database and no secrets. These
      # guards decide whether a restore is allowed to overwrite a live
      # database, which is not something to leave as untested shell.
      - name: Connection-string guards
        run: .github/scripts/guards.test.sh
