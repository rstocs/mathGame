name: Nightly database backup

# On Supabase's free plan there are NO backups. These dumps are therefore not a
# second safety net, they are the ONLY one — which is why this workflow fails
# loudly rather than skipping quietly, and why restore.md must be rehearsed
# before real student data exists.
#
# Retention is GitHub's artifact retention (90 days), plus whatever you keep by
# downloading one. Data is tiny, so nothing here is expensive.

on:
  schedule:
    # 07:10 UTC — roughly 2-3am US Eastern, after any evening practice session
    # has finished and long before anyone plays again.
    - cron: '10 7 * * *'
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      # Job-level so the version check can reach it too. Use the SESSION POOLER
      # string from the dashboard, not "direct connection": direct is IPv6-only
      # without the paid add-on and GitHub's runners are IPv4, and the other
      # pooler mode (port 6543) lacks the prepared statements pg_dump needs.
      # Stored as a repository secret; never in the repo.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Check the connection string looks usable
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret is not set - there is no backup running." >&2
            exit 1
          fi
          # Catch the wrong connection string here rather than letting pg_dump
          # fail as "Network is unreachable" against an IPv6 address, which
          # reads like an outage rather than the wrong string being copied.
          case "$SUPABASE_DB_URL" in
            *@db.*.supabase.co*)
              echo "This is the DIRECT connection string, which cannot be reached" >&2
              echo "from GitHub Actions: it is IPv6-only without the paid add-on." >&2
              echo "" >&2
              echo "Fix: dashboard -> Connect -> Session pooler, and copy that URI." >&2
              echo "It differs in two places, both easy to miss:" >&2
              echo "  host: aws-N-<region>.pooler.supabase.com (not db.<ref>.supabase.co)" >&2
              echo "  user: postgres.<ref>                     (not plain postgres)" >&2
              exit 1 ;;
            *:6543/*)
              echo "This is the TRANSACTION pooler (port 6543), which does not" >&2
              echo "support the prepared statements pg_dump needs." >&2
              echo "Fix: use the Session pooler URI instead - same host, port 5432." >&2
              exit 1 ;;
          esac

      - name: Install a pg_dump matching the server
        # pg_dump refuses to dump a server newer than itself. Pinning a version
        # here works until Supabase upgrades Postgres, and then the backup
        # starts failing on a night nobody is watching — the worst possible
        # time to discover the only copy of everyone's progress stopped being
        # written. So ask the server what it is and install that.
        #
        # psql is happy across versions (only pg_dump is strict), so the
        # preinstalled client is enough to run the query.
        run: |
          server_num=$(psql "$SUPABASE_DB_URL" -tAc 'show server_version_num')
          major=$((server_num / 10000))
          echo "Server is Postgres $major (server_version_num=$server_num)"

          sudo install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y "postgresql-client-$major"

          # Put the versioned binary first on PATH. Installing the package is
          # not enough: the runner already has an older /usr/bin/pg_dump, and
          # that is the one that was winning and refusing to run.
          echo "/usr/lib/postgresql/$major/bin" >> "$GITHUB_PATH"

      - name: Confirm the client is new enough
        # Assert it rather than trusting the install, so a mismatch fails here
        # with the reason spelled out instead of inside pg_dump's terser error.
        run: |
          server_major=$(( $(psql "$SUPABASE_DB_URL" -tAc 'show server_version_num') / 10000 ))
          client_major=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          echo "pg_dump $client_major vs server $server_major ($(command -v pg_dump))"
          if [ "$client_major" -lt "$server_major" ]; then
            echo "pg_dump is older than the server and will refuse to run." >&2
            exit 1
          fi

      - name: Dump the database
        run: |
          mkdir -p out
          # Custom format (-Fc): compressed, and pg_restore can read it
          # selectively. Include auth so accounts come back with the progress —
          # restoring progress whose owning users no longer exist would leave
          # every row unreachable behind its own RLS policy.
          pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --schema=public \
            --schema=auth \
            --file="out/mathgame-$(date -u +%Y-%m-%d).dump"
          ls -lh out/

      - name: Verify the dump is readable
        # A file that exists is not a backup. Listing its contents proves it
        # parses and that the tables we care about are actually inside it —
        # cheap here, and the difference between a backup and a hope.
        run: |
          dump=$(ls out/*.dump)
          pg_restore --list "$dump" > out/contents.txt
          for t in profiles stats level_progress review_schedule; do
            grep -q "TABLE DATA public $t" out/contents.txt \
              || { echo "MISSING TABLE IN BACKUP: $t" >&2; exit 1; }
          done
          echo "All four tables present."

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: out/
          retention-days: 90
