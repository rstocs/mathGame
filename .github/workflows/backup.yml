name: Nightly database backup

# On Supabase's free plan there are NO backups. These dumps are therefore not a
# second safety net, they are the ONLY one — which is why this workflow fails
# loudly rather than skipping quietly, and why restore.md must be rehearsed
# before real student data exists.
#
# Retention is GitHub's artifact retention (90 days), plus whatever you keep by
# downloading one. Data is tiny, so nothing here is expensive.

on:
  schedule:
    # 07:10 UTC — roughly 2-3am US Eastern, after any evening practice session
    # has finished and long before anyone plays again.
    - cron: '10 7 * * *'
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      # Job-level so the version check can reach it too. Use the SESSION POOLER
      # string from the dashboard, not "direct connection": direct is IPv6-only
      # without the paid add-on and GitHub's runners are IPv4, and the other
      # pooler mode (port 6543) lacks the prepared statements pg_dump needs.
      # Stored as a repository secret; never in the repo.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Check the connection string looks usable
        run: .github/scripts/check-db-url.sh SUPABASE_DB_URL "$SUPABASE_DB_URL"

      - name: Install a Postgres client matching the server
        run: .github/scripts/install-pg-client.sh "$SUPABASE_DB_URL"

      - name: Dump the database
        run: |
          mkdir -p out
          .github/scripts/dump-db.sh "$SUPABASE_DB_URL" \
            "out/mathgame-$(date -u +%Y-%m-%d).dump"

      - name: Verify the dump is readable
        # A file that exists is not a backup. Listing its contents proves it
        # parses and that the tables we care about are actually inside it —
        # cheap here, and the difference between a backup and a hope.
        run: |
          dump=$(ls out/*.dump)
          pg_restore --list "$dump" > out/contents.txt
          for t in profiles stats level_progress review_schedule; do
            grep -q "TABLE DATA public $t" out/contents.txt \
              || { echo "MISSING TABLE IN BACKUP: $t" >&2; exit 1; }
          done
          echo "All four tables present."

      - uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.run_id }}
          path: out/
          retention-days: 90
