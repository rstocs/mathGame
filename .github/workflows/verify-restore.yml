name: Verify a backup restores

# Proves the backups are actually restorable, end to end, without anyone
# installing Postgres tooling or copying connection strings by hand.
#
# Why this exists as a job rather than a page of instructions:
#
# A backup verified once is verified once. The schema will change, the Postgres
# version will change, and the failure mode of all of it is silent — the nightly
# dump keeps going green while producing something that cannot be restored. On
# the free plan these dumps are the only copy of every kid's progress, so
# "probably fine" is not a good enough answer to "can we get it back?".
#
# So this runs on a schedule, and on demand, and it proves the whole chain:
#   write a unique marker into the real database
#     -> dump the real database
#       -> restore that dump into a THROWAWAY database
#         -> read the marker back out of the restored copy
#
# Reading that exact marker out the far end is the only thing that counts as
# proof. Every other check here is a nicety.

on:
  schedule:
    # Mondays and Thursdays, 08:00 UTC. Catching drift would only need this
    # monthly, but the scratch project is on the free plan too and pauses after
    # a week idle - a monthly job would find it asleep and fail every time,
    # and a verification that cries wolf gets switched off.
    #
    # Twice a week leaves a maximum gap of four days, comfortably inside the
    # limit, and the job's own connections are what keep that project awake.
    - cron: '0 8 * * 1,4'
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SOURCE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # The scratch project's session pooler URI. A SEPARATE free project,
      # never the real one - see the guard below.
      TARGET_DB_URL: ${{ secrets.SUPABASE_RESTORE_TEST_DB_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Refuse to restore over the real database
        run: .github/scripts/assert-different-db.sh "$SOURCE_DB_URL" "$TARGET_DB_URL"

      - name: Check both connection strings look usable
        run: |
          .github/scripts/check-db-url.sh SUPABASE_DB_URL "$SOURCE_DB_URL"
          .github/scripts/check-db-url.sh SUPABASE_RESTORE_TEST_DB_URL "$TARGET_DB_URL"

      - name: Check the scratch project is awake
        run: |
          # Show what psql actually said. Swallowing it and printing a guess is
          # how a wrong password or a still-provisioning project gets diagnosed
          # as "paused" and sends someone looking in the wrong place.
          if ! psql "$TARGET_DB_URL" -tAc 'select 1'; then
            echo "" >&2
            echo "Could not reach the restore-test project. The psql error" >&2
            echo "above is the real reason. Common ones:" >&2
            echo "  password authentication failed -> wrong password. Each" >&2
            echo "    project has its own; this needs the scratch project's." >&2
            echo "  could not translate host name -> still being created;" >&2
            echo "    give a new project a couple of minutes." >&2
            echo "  connection timed out -> free projects pause after a week" >&2
            echo "    idle. Open it in the dashboard and press Restore." >&2
            exit 1
          fi
          echo "Scratch project is awake."

      - name: Install a Postgres client matching the server
        run: .github/scripts/install-pg-client.sh "$SOURCE_DB_URL"

      - name: Plant a unique marker in the real database
        # An empty database restores "successfully" whether or not any data
        # moves, so restoring nothing and finding nothing proves nothing. A
        # value that exists nowhere else, written now, is what makes this a
        # test rather than a ceremony.
        #
        # One row per run in a table of its own. It is never read by the app.
        run: |
          marker="run-${GITHUB_RUN_ID}-$(date -u +%s)"
          echo "MARKER=$marker" >> "$GITHUB_ENV"
          psql "$SOURCE_DB_URL" -v ON_ERROR_STOP=1 <<SQL
          create table if not exists public.backup_canary (
            id bigserial primary key,
            marker text not null,
            written_at timestamptz not null default now()
          );
          insert into public.backup_canary (marker) values ('$marker');
          SQL
          echo "Planted: $marker"

      - name: Dump the real database
        # The same script the nightly backup uses, so this cannot verify a
        # dump taken differently from the one actually being kept.
        run: .github/scripts/dump-db.sh "$SOURCE_DB_URL" verify.dump


      - name: Restore into the throwaway database
        # pg_restore exits non-zero over things that do not matter here: it
        # drops objects that do not exist yet, and it does not own Supabase's
        # auth schema. Those are expected, so the exit code is not the test -
        # the next step is. Errors are kept and shown if that step fails.
        run: |
          set +e
          pg_restore -d "$TARGET_DB_URL" \
            --clean --if-exists --no-owner \
            verify.dump > restore.log 2>&1
          echo "pg_restore exit code: $? (not the verdict - see next step)"
          tail -5 restore.log || true

      - name: Read the marker back out of the restored copy
        # The actual test. This value was written to one database and is being
        # read from a different one, having travelled through a dump file.
        run: |
          found=$(psql "$TARGET_DB_URL" -tAc \
            "select marker from public.backup_canary where marker = '$MARKER'")
          if [ "$found" != "$MARKER" ]; then
            echo "RESTORE VERIFICATION FAILED." >&2
            echo "Expected marker: $MARKER" >&2
            echo "Got: '${found:-<nothing>}'" >&2
            echo "" >&2
            echo "The backups cannot be relied on. Full restore log:" >&2
            cat restore.log >&2
            exit 1
          fi
          echo "Marker survived the round trip: $MARKER"

      - name: Compare table contents
        # Secondary check. The marker proves the pipe works; this proves the
        # tables that hold real progress came across too, rather than one lucky
        # row in a table nothing depends on.
        run: |
          fail=0
          for t in profiles stats level_progress review_schedule; do
            src=$(psql "$SOURCE_DB_URL" -tAc "select count(*) from public.$t")
            tgt=$(psql "$TARGET_DB_URL" -tAc "select count(*) from public.$t")
            if [ "$src" = "$tgt" ]; then
              echo "  ok   $t: $src rows"
            else
              echo "  FAIL $t: source $src, restored $tgt" >&2
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "Restored copy does not match source." >&2; exit 1; }
          echo "All four tables match."

      - name: Tidy up the canary table
        # Keep the last few rows as evidence of recent verifications, and stop
        # this from growing without bound.
        if: always()
        run: |
          psql "$SOURCE_DB_URL" -c \
            "delete from public.backup_canary where id not in (
               select id from public.backup_canary order by id desc limit 12)" || true
