name: Deploy Edge Functions

# The app and its server-side functions live in one repository but ship to two
# different places: the app to a static host, the functions to Supabase. Without
# this, editing a function and pushing changes nothing — the old version keeps
# running, silently, and the only clue is that a fix did not take effect.
#
# So functions deploy the same way everything else does: push, and it is live.

on:
  push:
    branches: [main]
    # Only when a function actually changed. Deploying on every push would put
    # a slow, credential-using step in front of every documentation typo.
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy every function
        env:
          # A personal access token from supabase.com/dashboard/account/tokens.
          # This is the only new secret needed: the project reference is read
          # out of SUPABASE_URL, which the keepalive job already uses, because
          # one more secret to create is one more chance to paste the wrong
          # value into it.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set, so nothing was deployed." >&2
            echo "" >&2
            echo "Create one at supabase.com/dashboard/account/tokens and add" >&2
            echo "it as a repository secret. Until then the delete-account" >&2
            echo "function will not exist and that button will fail." >&2
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL is not set; cannot work out which project." >&2
            exit 1
          fi

          # https://<ref>.supabase.co -> <ref>
          ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's|https?://([a-z0-9]+)\..*|\1|')
          if [ -z "$ref" ] || [ "$ref" = "$SUPABASE_URL" ]; then
            echo "Could not read a project ref out of SUPABASE_URL." >&2
            echo "Expected https://<ref>.supabase.co" >&2
            exit 1
          fi
          echo "Deploying to project $ref"

          # Loop over the directories rather than naming functions here, so
          # adding one later needs no edit to this file — a workflow that has
          # to be remembered is a workflow that gets forgotten.
          found=0
          for dir in supabase/functions/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            echo "--- $name ---"
            npx --yes supabase@latest functions deploy "$name" --project-ref "$ref"
            found=$((found + 1))
          done

          if [ "$found" -eq 0 ]; then
            echo "No functions found under supabase/functions/." >&2
            exit 1
          fi
          echo "Deployed $found function(s)."
