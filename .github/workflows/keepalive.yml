name: Keep the free project awake

# Supabase pauses free projects after a week with no activity, and an unpausing
# has to be done by hand in the dashboard. Without this, a kid coming back from
# a two-week holiday finds a broken app and no way to fix it themselves.
#
# One tiny read every three days is enough to count as activity. This becomes
# unnecessary the day the project moves to a paid plan; delete it then.

on:
  schedule:
    - cron: '30 6 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL secret is not set - the project may pause." >&2
            exit 1
          fi
          # An unauthenticated read of a protected table. It is SUPPOSED to be
          # refused: `anon` is granted nothing on these tables, so the answer
          # comes back as 401 or 404 rather than data.
          #
          # That refusal is the success case. The only thing being tested is
          # that the project replied at all, so any answer below 500 counts —
          # asserting a specific code here would turn a correct security
          # posture into a failing nightly job.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          if [ "$code" = "000" ]; then
            echo "No response at all - the project may be paused or unreachable." >&2
            exit 1
          fi
          if [ "$code" -ge 500 ]; then
            echo "Server error - check the project." >&2
            exit 1
          fi
          echo "Project is awake."
